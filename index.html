<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#355e48" />
    <script id="theme-init">
      (() => {
        let preference = "system";
        try {
          const saved = localStorage.getItem("roamly-theme");
          if (saved === "light" || saved === "dark") preference = saved;
        } catch {}
        const dark = preference === "dark" || (preference === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#121b17" : "#f8f9f6");
      })();
    </script>
    <meta
      name="description"
      content="Roamly — a personal travel companion for your kind of journey. Discover Kerala, plan trips in rupees, and bring your vehicle and budget along."
    />
    <title>Roamly — Your Kerala chapter</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=roamly-sidebar" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;450;500;550;600;650;700&family=Manrope:wght@400;500;600;650;700;750;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
